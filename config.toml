baseURL = "https://blog.kammel.dev/"
locale = "en-us"
title = "DaTosh Blog"
summarylength = 10

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    noHl = false
    tabWidth = 4
    wrapperClass = 'highlight'

[params]
title = "DaTosh Blog"
author = "DaTosh"
name = "Fabian Kammel"
description = "Software Engineering, Security, and Cloud Native Technologies"
profilePicture = "images/Profile.jpg"
copyrightStart = 2020

# Add these for better SEO
keywords = ["software engineering", "kubernetes", "cloud native", "security", "golang"]

# Shown in the home hero and footer, in this order, followed by RSS.
