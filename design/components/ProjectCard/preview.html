<!doctype html>
<html data-theme="light">
<head><meta charset="utf-8"><title>ProjectCard — preview</title>
<style>body{margin:0;background:var(--surface)}</style><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/bundle.css">
<style>.ds-theme{position:fixed;right:12px;bottom:12px;z-index:99;font:500 13px/1 system-ui;padding:8px 12px;border-radius:980px;border:1px solid var(--hairline);background:var(--surface-raised);color:var(--ink);cursor:pointer}</style></head>
<body>
<div class="fk-page" id="root">
<div class="fk-container" style="padding-top:24px;padding-bottom:24px"><div class="fk-grid">
  <a class="fk-card fk-project" href="#">
    <div class="fk-card__body">
      <div class="fk-project__head"><h3 class="fk-card__title headline">GoInvaders</h3><svg class="fk-icon" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M7 7h10v10" /> <path d="M7 17 17 7" /> </svg></div>
      <p class="fk-card__desc body-sm">A Space Invaders clone written in Go, compiled to WebAssembly and playable in the browser.</p>
      <p class="fk-project__domain caption" style="margin-top:auto;padding-top:12px">kammel.dev/goinvaders</p>
    </div>
  </a>
  <a class="fk-card fk-project" href="#">
    <div class="fk-card__body">
      <div class="fk-project__head"><h3 class="fk-card__title headline">Pin GH Actions</h3><svg class="fk-icon" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M7 7h10v10" /> <path d="M7 17 17 7" /> </svg></div>
      <p class="fk-card__desc body-sm">Tracks how many GitHub repositories pin their Actions to a full-length commit SHA.</p>
      <p class="fk-project__domain caption" style="margin-top:auto;padding-top:12px">pin-gh-actions.kammel.dev</p>
    </div>
  </a>
  <a class="fk-card fk-project" href="#">
    <div class="fk-card__body">
      <div class="fk-project__head"><h3 class="fk-card__title headline">ElvenXCEL</h3><svg class="fk-icon" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M7 7h10v10" /> <path d="M7 17 17 7" /> </svg></div>
      <p class="fk-card__desc body-sm">Side project.</p>
      <p class="fk-project__domain caption" style="margin-top:auto;padding-top:12px">elvenxcel.app</p>
    </div>
  </a>
</div></div>
</div>

<button class="ds-theme" onclick="var d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'">Toggle theme</button>
</body>
</html>
