<!doctype html>
<html data-theme="light">
<head><meta charset="utf-8"><title>SiteHeader — preview</title>
<style>body{margin:0;background:var(--surface)}</style><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/bundle.css">
<style>.ds-theme{position:fixed;right:12px;bottom:12px;z-index:99;font:500 13px/1 system-ui;padding:8px 12px;border-radius:980px;border:1px solid var(--hairline);background:var(--surface-raised);color:var(--ink);cursor:pointer}</style></head>
<body>
<div class="fk-page" id="root">
<header class="fk-header">
  <div class="fk-container fk-header__inner">
    <a class="fk-wordmark headline" href="#">Fabian Kammel</a>
    <nav class="fk-nav ui" aria-label="Main">
      <a href="#" aria-current="page">Posts</a>
      <a href="#">Talks</a>
      <a href="#">Projects</a>
    </nav>
    <div class="fk-header__tools">
      <a class="fk-icon-btn" href="#" aria-label="RSS feed"><svg class="fk-icon" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M4 11a9 9 0 0 1 9 9" /> <path d="M4 4a16 16 0 0 1 16 16" /> <circle cx="5" cy="19" r="1" /> </svg></a>
      <button class="fk-icon-btn fk-theme-toggle" type="button" aria-label="Switch colour theme"><svg class="fk-icon fk-icon--sun" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" /> </svg><svg class="fk-icon fk-icon--moon" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /> </svg></button>
    </div>
  </div>
</header>
<div class="fk-container" style="padding-top:24px"><p class="caption" style="color:var(--ink-muted);margin:0">Content scrolls beneath the translucent bar.</p></div>
</div>

<button class="ds-theme" onclick="var d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'">Toggle theme</button>
</body>
</html>
