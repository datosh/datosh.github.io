<!doctype html>
<html data-theme="light">
<head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;background:var(--surface)}</style><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/bundle.css">
<style>.ds-theme{position:fixed;right:12px;bottom:12px;z-index:99;font:500 13px/1 system-ui;padding:8px 12px;border-radius:980px;border:1px solid var(--hairline);background:var(--surface-raised);color:var(--ink);cursor:pointer}</style></head>
<body>
<div class="fk-page" id="root">
<div class="fk-container" style="padding-top:24px;padding-bottom:24px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <a class="fk-btn fk-btn--primary ui" href="#"><svg class="fk-icon fk-icon--sm" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <polygon points="6 3 20 12 6 21 6 3" /> </svg>Watch the recording</a>
    <a class="fk-btn fk-btn--secondary ui" href="#"><svg class="fk-icon fk-icon--sm" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M2 3h20" /> <path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3" /> <path d="m7 21 5-5 5 5" /> </svg>Get the slides</a>
    <a class="fk-btn fk-btn--secondary fk-btn--sm ui" href="#">Subscribe via RSS</a>
  </div>
  <div class="body-sm"><a class="fk-arrow-link" href="#">All posts<svg class="fk-icon fk-icon--sm" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg></a></div>
</div>
</div>

<button class="ds-theme" onclick="var d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'">Toggle theme</button>
</body>
</html>
